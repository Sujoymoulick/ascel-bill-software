[package]
name = "ascel-bill"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "objc2-app-kit"] }

[profile.release]
strip = true
lto = "thin"
